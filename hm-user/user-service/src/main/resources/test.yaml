spring:
  datasource:
    url: "jdbc:mysql://${hm.db.host:192.168.41.128}:${hm.db.port:3306}/{hm.db.dbname}?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true"
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${hm.db.um:root}
    password: ${hm.db.pw:123456}

mybatis-plus:
  configuration:
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      update-strategy: not_null
      id-type: auto